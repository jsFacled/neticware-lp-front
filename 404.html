<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/">
  <script>
    // Extrae la última parte de la ruta y la convierte en hash
    const pathParts = window.location.pathname.split("/").filter(part => part);
    const hash = pathParts.length > 0 ? "#" + pathParts[pathParts.length - 1] : "#hero";
    window.location.href = "/" + hash;
  </script>
  <title>Página no encontrada - Neticware</title>
</head>
<body>
  <p>La página que buscas no existe. Redirigiendo a la página principal...</p>
</body>
</html>
