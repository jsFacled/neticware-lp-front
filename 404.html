<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirigiendo...</title>
    <script>
        // Obtiene la ruta limpia y la guarda en sessionStorage
        // para que main.js la pueda leer
        sessionStorage.redirect = location.href;

        // Redirige al inicio para cargar la SPA
        location.href = location.pathname.substring(0, location.pathname.indexOf('/',1) + 1);
    </script>
</head>
<body>
</body>
</html>
