<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Error | Neticware</title>
  <style>
    :root{--bg:#0A1C3D;--card:#111827;--text:#E5E7EB;--muted:#9AA3B2;--accent1:#1F6BFF;--accent2:#8B5CF6}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;display:grid;place-items:center;background:radial-gradient(1000px 500px at 20% 10%,rgba(31,107,255,.15),transparent),linear-gradient(135deg,#0A1C3D,#0a1330);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
    .card{width:min(680px,92vw);background:linear-gradient(180deg,rgba(17,24,39,.9),rgba(17,24,39,.7));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:10px}
    .brand img{height:32px;width:auto;border-radius:6px}
    h1{margin:.2rem 0 0;font-size:1.6rem}
    .code{font-size:3rem;font-weight:800;letter-spacing:.03em;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:var(--muted);margin:.4rem 0 1rem}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.18);text-decoration:none;color:#fff;transition:transform .15s ease, box-shadow .15s ease}
    a.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 8px 24px rgba(31,107,255,.35)}
    a.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.25)}
    small{display:block;margin-top:12px;color:#8aa0c8}
  @keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.brand img {
  height:32px;
  width:auto;
  border-radius:6px;
  animation: spin 6s linear infinite; /* 👈 rotación continua */
}

  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="ttl">
    <div class="brand">
      <img src="assets/images/neticware-logo.png" alt="Neticware" />
      <h1 id="ttl">Hubo un problema al cargar la página</h1>
    </div>

    <div class="code" aria-hidden="true">404 / 5xx</div>
    <p>No pudimos encontrar lo que buscás o ocurrió un error temporal.</p>

    <div class="actions">
      <a class="btn primary" href="/">Volver al inicio</a>
      <a class="btn" href="mailto:contacto@neticware.com.ar">Reportar el error</a>
    </div>

    <small>Id de referencia: <script>document.write((crypto?.randomUUID?.()||Math.random().toString(36).slice(2)).slice(0,8));</script></small>
  </main>
</body>
</html>
