<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test FormSubmit</title>
</head>
<body>
  <h2>Test FormSubmit con fetch</h2>
  <form id="contactForm">
    <input type="text" name="name" placeholder="Tu nombre" required><br>
    <input type="email" name="email" placeholder="Tu correo" required><br>
    <textarea name="message" placeholder="Tu mensaje" required></textarea><br>
    <button type="submit">Enviar</button>
  </form>

  <p id="result"></p>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value,
        _captcha: "false",
        _subject: "Test desde fetch minimal"
      };

      try {
        const response = await fetch("https://formsubmit.co/ajax/ef7d59049898d7f53426aae769f74ea4", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        document.getElementById("result").textContent = JSON.stringify(result);
      } catch (err) {
        document.getElementById("result").textContent = "Error: " + err;
      }
    });
  </script>
</body>
</html>
