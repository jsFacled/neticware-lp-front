/* Bloque principal del logo */
.logo {
  box-sizing: border-box;
  display: flex;
  flex-direction: row;
  align-items: center;
  flex-wrap: nowrap;
  gap: 0.5rem;

.logo__iconContainer {
  display: flex;
  align-items: left;
}

.logo__icon {
  display: inline-block;
  height: clamp(30px, 30vw, 90px);
  width: auto;
  transition: transform 1s ease-out;
}

/* ============================================
   🔁 Animación al hacer hover (gira rápido 4 vueltas y se detiene)
   ============================================ */
.logo__icon:hover {
  animation: spin-fast 1s ease-out 1 forwards;
}

@keyframes spin-fast {
  0%   { transform: rotate(0deg); }
  90%  { transform: rotate(1440deg); }
  100% { transform: rotate(1440deg); }
}

.logo__icon--footer-spin {
  animation: spin 6s linear infinite;
}

/* ============================================
   🔒 Animación original al cargar (comentada)
   ============================================ */
/*

  animation: spin 6s linear infinite;
}
*/

@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }

/* ---- ---- ---- General para Hero ---- ---- ---- */
.hs2 {
  background-image: url("src/main/frontend/themes/nw-base/images/escritorio-bottom-colores.png");
   background-image: url("src/main/frontend/themes/nw-base/images/Futurista-Azul-oscuro.png");

  background-size: cover;

  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  position: relative;
  padding: 2em;
}

/* ---- ---- ---- Título principal ---- ---- ---- */

.hs2 h1 {
  font-size: 3rem;
  margin: 1rem 0 2rem 0;
  color: white;
  text-shadow: 1px 1px 2px black;
  align-self: center;
  background-color: rgba(10, 10, 25, 0.4); /* violeta azulado semitransparente */
  border-radius: 4px;
  }

.hs2 h1:hover {
  background-color: rgba(10, 10, 25, 0.7); /* más oscuro al pasar el mouse */
  transition: background-color 0.3s ease;
  border-radius: 10px;
}


/* ---- ---- ----  Contenedor para subtítulo + botón ---- ---- ---- */

.hs2 .hs2-content {
  width: 100%;
  max-width: 30em;         /* ✅ límite máximo en desktop */
  min-width: 0;            /* ✅ asegura que no haya desbordes */
  box-sizing: border-box;  /* ✅ asegura que padding no sume al ancho */
  height: 20em;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  margin-top: 4.5rem;

  color: white;
  border-radius: 12px;
  background-color: rgba(10, 10, 25, 0.4);
  padding: 1.5em;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

}

/* ---- ---- ----  /* Subtítulo */ ---- ---- ---- */

.hs2 p {
  font-size: 1.2rem;
  margin-bottom: 1.5rem;
  max-width: 600px;
  text-align: left;
}

.hs2 p:hover {
  background-color: rgba(10, 10, 25, 0.7);
  transition: background-color 0.3s ease;
   border-radius: 5px;
}


/* ---- Botón - Contenedor principal ---- */
.hs2 .hs2-cta {
  position: relative;
  overflow: hidden;

  /* El fondo principal es un color sólido o semitransparente para que sea visible sin hover */
  background-color: rgba(31, 107, 255, 0.2);

  color: white;
  /* El borde es visible en el estado normal */
  border: 2px solid #1F6BFF;
  border-radius: 8px;
  padding: 0.6em 1.2em;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  z-index: 1;
  box-shadow: 0 4px 12px rgba(31, 107, 255, 0.3);
  max-width: fit-content;
  margin-top: 1rem;
  transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out, background-color 0.3s ease;
}

/* ---- Pseudo-elemento con el fondo de degradado (ahora en el hover) ---- */
.hs2 .hs2-cta::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(135deg, #1F6BFF, #8B5CF6);
  z-index: -1;
  /* El degradado se oculta por defecto y aparece al hacer hover */
  transform: scale(0);
  transition: transform 0.3s ease-in-out;
}

/* ---- Pseudo-elemento con el borde animado (conic-gradient) ---- */
.hs2 .hs2-cta::after {
  content: "";
  position: absolute;
  /* Ajuste a 0px para que el borde se vea más sutil */
  top: 0px;
  left: 0px;
  right: 0px;
  bottom: 0px;
  border-radius: 8px; /* Mismo radio que el botón para un ajuste perfecto */
  background: conic-gradient(from 0deg, #1F6BFF, #8B5CF6, #1F6BFF);
  z-index: -2;
  /* Oculto por defecto, aparece con hover */
  transform: scale(0);
  opacity: 0;
  transition: transform 0.2s ease-in-out, opacity 0.2s ease-in-out;
}

/* ---- ESTADO HOVER: se activan los efectos ---- */
.hs2 .hs2-cta:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(31, 107, 255, 0.4);
  /* El fondo principal se vuelve transparente al hacer hover */
  background-color: transparent;
}

/* ---- ESTADO HOVER: se muestra el fondo de degradado ---- */
.hs2 .hs2-cta:hover::before {
  transform: scale(1);
}

/* ---- ESTADO HOVER: se muestra y anima el borde ---- */
.hs2 .hs2-cta:hover::after {
  animation: rotate-border 2s linear infinite;
  transform: scale(1);
  opacity: 1;
}

@keyframes rotate-border {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
/**** @ @ @ @ @ @ @ ******* RESPONSIVE **** @ @ @ @ @ @ @ @ *******/
@media (max-width: 768px) {
  .hs2 .hs2-content {
    width: 90%;
       height: auto;

       padding: 1em;
       margin: 0 auto; /* opcional: para centrar */
  }

  .hs2 p {
    font-size: 1rem;
  }

  .hs2 button {
    font-size: 0.9rem;
    padding: 0.6em 1em;
  }
}

              inset 0 0 0 1px rgba(120,146,255,0.08);
  padding: 28px;
  color: #EAF0FF;
}

.form-wrapper h2 {
  margin: 0 0 8px 0;
  font-weight: 700;
  color: #fff;

/* 🔹 Fuerza texto blanco en campos Vaadin */

.form-wrapper vaadin-text-area {

/* 🔹 reCAPTCHA Wrapper */

/* 🔹 Ajustes para que el reCAPTCHA se vea bien en fondo oscuro */

/* Botón CTA */

}
</style>
</head>
<body>
<header class="logo fade-in">
  <div id="logo3d" class="logo--3d-container"></div>
  <div class="logo__text-group">
    <span class="logo__name">Neticware</span>
    <span class="logo__description">Innovación Digital</span>
  </div>
</header>

<main class="fade-in" style="animation-delay:0.5s">
  <h1>Bienvenido a Neticware</h1>
  <p>Explora nuestras soluciones modernas para la web.</p>
</main>

<footer class="footer fade-in" style="animation-delay:1s">
  <p>&copy; 2024 Neticware</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
class NWLogo3D {
    constructor(containerId) {
        this.containerId = containerId;
        this.container = document.getElementById(containerId);
        if (!this.container) {
            console.error('Container not found:', containerId);
            return;
        }
        this.init();
    }

    init() {
        // Scene setup
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45,
            this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
        this.camera.position.set(0, 0, 12);

        // Renderer
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setClearColor(0x000000, 0);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        // Logo group
        this.logoGroup = new THREE.Group();
        this.scene.add(this.logoGroup);

        // Create logo
        this.createNWLogo();
        this.setupLights();
        this.setupEventListeners();
        this.animate();

        // Handle resize
        this.handleResize();
    }

    createNWLogo() {
        const extrudeSettings = {
            depth: 1.5,
            bevelEnabled: true,
            bevelSegments: 8,
            bevelSize: 0.1,
            bevelThickness: 0.1
        };

        // N Shape
        const nShape = new THREE.Shape();
        nShape.moveTo(-2, -3);
        nShape.lineTo(-1, -3);
        nShape.lineTo(-1, 1);
        nShape.lineTo(0.5, -1.5);
        nShape.lineTo(0.5, -3);
        nShape.lineTo(1.5, -3);
        nShape.lineTo(1.5, 3);
        nShape.lineTo(0.5, 3);
        nShape.lineTo(0.5, 1);
        nShape.lineTo(-1, 2.5);
        nShape.lineTo(-1, 3);
        nShape.lineTo(-2, 3);
        nShape.lineTo(-2, -3);

        // W Shape (corregida)
        const wShape = new THREE.Shape();
        wShape.moveTo(0.5, 3);
        wShape.lineTo(1.2, 3);
        wShape.lineTo(1.9, -1);
        wShape.lineTo(2.5, 1);
        wShape.lineTo(3.1, -1);
        wShape.lineTo(3.8, 3);
        wShape.lineTo(4.5, 3);
        wShape.lineTo(4.5, -3);
        wShape.lineTo(3.6, -3);
        wShape.lineTo(2.8, 0);
        wShape.lineTo(2.5, -1.5);
        wShape.lineTo(2.2, 0);
        wShape.lineTo(1.4, -3);
        wShape.lineTo(0.5, -3);
        wShape.lineTo(0.5, 3);

        // Create geometries
        const nGeometry = new THREE.ExtrudeGeometry(nShape, extrudeSettings);
        const wGeometry = new THREE.ExtrudeGeometry(wShape, extrudeSettings);

        // Materials
        const nMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ffff,
            shininess: 100,
            transparent: true,
            opacity: 0.9
        });

        const wMaterial = new THREE.MeshPhongMaterial({
            color: 0x8a2be2,
            shininess: 100,
            transparent: true,
            opacity: 0.9
        });

        // Create meshes
        const nMesh = new THREE.Mesh(nGeometry, nMaterial);
        const wMesh = new THREE.Mesh(wGeometry, wMaterial);

        nMesh.position.set(-1.5, 0, 0);
        wMesh.position.set(1, 0, 0);

        nMesh.castShadow = true;
        nMesh.receiveShadow = true;
        wMesh.castShadow = true;
        wMesh.receiveShadow = true;

        this.logoGroup.add(nMesh);
        this.logoGroup.add(wMesh);

        this.createParticles();
    }

    createParticles() {
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 50; // Reducido para mejor performance en Vaadin
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 15;
            positions[i3 + 1] = (Math.random() - 0.5) * 15;
            positions[i3 + 2] = (Math.random() - 0.5) * 8;

            const t = Math.random();
            if (t < 0.33) {
                colors[i3] = 0; colors[i3 + 1] = 1; colors[i3 + 2] = 1;
            } else if (t < 0.66) {
                colors[i3] = 1; colors[i3 + 1] = 0; colors[i3 + 2] = 1;
            } else {
                colors[i3] = 0.5; colors[i3 + 1] = 0.2; colors[i3 + 2] = 0.9;
            }
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        this.scene.add(particles);
    }

    setupLights() {
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        this.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        this.scene.add(directionalLight);

        const cyanLight = new THREE.PointLight(0x00ffff, 0.6, 20);
        cyanLight.position.set(-5, 2, 3);
        this.scene.add(cyanLight);

        const magentaLight = new THREE.PointLight(0xff00ff, 0.6, 20);
        magentaLight.position.set(5, -2, 3);
        this.scene.add(magentaLight);
    }

    setupEventListeners() {
        this.mouseX = 0;
        this.mouseY = 0;
        this.targetRotationX = 0;
        this.targetRotationY = 0;
        this.isMouseDown = false;

        this.container.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.container.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.container.addEventListener('mouseup', () => this.onMouseUp());
        this.container.addEventListener('wheel', (e) => this.onMouseWheel(e));
    }

    onMouseDown(event) {
        this.isMouseDown = true;
        this.mouseX = event.clientX;
        this.mouseY = event.clientY;
    }

    onMouseMove(event) {
        if (!this.isMouseDown) return;

        const deltaX = event.clientX - this.mouseX;
        const deltaY = event.clientY - this.mouseY;

        this.targetRotationY += deltaX * 0.01;
        this.targetRotationX += deltaY * 0.01;

        this.mouseX = event.clientX;
        this.mouseY = event.clientY;
    }

    onMouseUp() {
        this.isMouseDown = false;
    }

    onMouseWheel(event) {
        this.camera.position.z += event.deltaY * 0.01;
        this.camera.position.z = Math.max(5, Math.min(20, this.camera.position.z));
    }

    handleResize() {
        window.addEventListener('resize', () => {
            if (this.container && this.camera && this.renderer) {
                this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
            }
        });
    }

    animate() {
        requestAnimationFrame(() => this.animate());

        if (this.logoGroup) {
            this.logoGroup.rotation.x += (this.targetRotationX - this.logoGroup.rotation.x) * 0.05;
            this.logoGroup.rotation.y += (this.targetRotationY - this.logoGroup.rotation.y) * 0.05;

            if (!this.isMouseDown) {
                this.targetRotationY += 0.005;
            }

            this.logoGroup.position.y = Math.sin(Date.now() * 0.001) * 0.2;
        }

        if (this.renderer && this.scene && this.camera) {
            this.renderer.render(this.scene, this.camera);
        }
    }

    destroy() {
        if (this.renderer) {
            this.container.removeChild(this.renderer.domElement);
            this.renderer.dispose();
        }
    }
}

// Global function para Vaadin
// Versión alternativa: NWLogo3D_2
window.NWLogo3D_2 = NWLogo3D;
window.initNWLogo2 = function(containerId) {
    return new NWLogo3D(containerId);
};</script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  if (window.initNWLogo2) {
    initNWLogo2('logo3d');
  }
});
</script>
</body>
